# =============================================================================
# .fenix/verify.yaml — 验证契约
# （Administrator 起草 2026-11-08，针对 spec: m0-a2a-streaming-pipeline 的
#   verify_contract_missing 信号；完整字段语义见 core/verify_contract.py docstring）
#
# 2026-11-11 Administrator 补段（spec: web-browser-client 的 verify_env_blocked
#   信号，serve_missing_for_scenario_kinds 检出）：web-browser-client 实现已合入
#   主树（client-web/ 网关 + 浏览器端），场景集由纯 cli 扩为 api/cli/web 混合，
#   serve/ready 不再可省——补 serve(command)/ready 两段与 client-web prepare
#   两步（步骤 5/6）；既有 prepare 步骤 1-4 与 regression 段一字未动。
# =============================================================================

# 【项目形态判定】
# Android 串流平台（Gradle 工程 protocol/ + source/ + client/）+ 浏览器观看端
# （client-web/：Node 网关 client-web/gateway + vite 构建 client-web/app，产物
#  dist/ 由网关同端口静态托管，/ws 升级同端口，docs/web-client.md §2）。交付物
# 为 APK、adb/双模拟器驱动脚本与浏览器端。
# 2026-11-08 起草时验证场景为纯 cli 形态，serve/ready 整段省略合法；自
# web-browser-client 起场景集含 api/web（需被验证应用可服务），按
# verify-runner-engine「含 web/api 场景」规则补 serve/ready。纯 cli 场景集的
# spec 验证仍按引擎口径跳过实例拉起（serve/ready 全省是无实例形态的执行期
# 判定，与契约是否声明 serve 无关），互不影响。
#
# 【prepare 渐进生效形态】
# 构建步骤按各工程落地存在性渐进生效——未落地工程跳过；已落地工程每轮验证
# fresh 构建，构建失败非零退出 = 验证环境错误（唯一环境门，走 infra-retry
# 廉价重试车道）。Gradle 各模块分步以各享 600s 步级超时预算
# （PREPARE_STEP_TIMEOUT）；client-web 两步同理（npm ci 幂等，lockfile 定版）。
#
# 【serve/ready】（2026-11-11 补段）
# 网关单进程即被测实例：GATEWAY_PORT={port} 消费框架注入的空闲端口（同值导出
# FENIX_VERIFY_PORT，场景 origin 全量改写到本实例）；STATIC_DIR 指向 vite 构建
# 产物 dist/（prepare 步骤 6 保证新鲜）。UPSTREAM 缺省 127.0.0.1:22333 与生产
# 部署一致——网关为纯字节中继，upstream TCP 按 WS 连接惰性建立，实例就绪不
# 依赖源端存活；源端通路（adb forward）由场景执行期脚本编排。ready 探 / 期望
# 200：网关目录请求回落 index.html、未命中文件 404，鉴别力自检（随机路径≠探针
# 响应）通过。
#
# 【regression 段】
# 2026-11-08 起草时测试体系尚未落地故合法省略；protocol 纯 JVM 单测落地
# 后经 verify_regression_missing 车道补段（Administrator 2026-11-09）：5 个
# Kotlin 测试类（protocol/src/test/kotlin/，JUnit 4，39 例），gradle test
# 产每类一份 XML 于 protocol/build/test-results/test/，cmd 内合并为单一
# <testsuites> XML 供 output 解析（产物目录在 .fenix/* ignore 规则内，不入库）。
#
# 【环境事实与预检边界】（立项侦察 + 2026-11-08 复核）
# /opt/android-sdk 已装齐（SDK 34 + emulator 37.2）；双模拟器
# emulator-5554(src)/emulator-5556(client) 常驻 = 本项目验证夹具。prepare
# 预检【不做】模拟器清杀：常驻模拟器 ppid=1 系启动者退出后的正常 reparent，
# 模板预检①的 ppid=1 孤儿清杀会误杀夹具。设备编排（双模拟器健康检查/APK
# 安装/adb forward/UDP 中继）由 scripts/bootstrap_adb.sh 在场景执行期完成，
# 不属 prepare 职责。
# =============================================================================

prepare:
  # 步骤 1：宿主依赖预检（幂等；任一失败即非零退出 → 环境门如实拦截，
  # 走 infra-retry 廉价重试；不吞错退 0）
  - run: |
      test -w /dev/kvm
      free -m | awk 'NR==2{exit !(($7)>512)}'
      command -v adb >/dev/null

  # 步骤 2：协议共享模块（纯 JVM 库）——build 含 test（FramingTest 等），
  # 与 App 构建分步以各享 600s 步级超时预算（PREPARE_STEP_TIMEOUT）
  - run: |
      if [ -f protocol/gradlew ]; then
        chmod +x protocol/gradlew
        (cd protocol && ./gradlew --no-daemon --console=plain build) || exit 1
      else
        echo "[prepare] protocol/gradlew 不存在——协议模块尚未落地，跳过构建"
      fi

  # 步骤 3：源端 App（Android 工程）——fresh 构建 debug APK
  - run: |
      if [ -f source/gradlew ]; then
        chmod +x source/gradlew
        export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/android-sdk}"
        export ANDROID_HOME="${ANDROID_HOME:-/opt/android-sdk}"
        (cd source && ./gradlew --no-daemon --console=plain assembleDebug) || exit 1
      else
        echo "[prepare] source/gradlew 不存在——源端工程尚未落地，跳过构建"
      fi

  # 步骤 4：观看端 App（Android 工程）——fresh 构建 debug APK
  - run: |
      if [ -f client/gradlew ]; then
        chmod +x client/gradlew
        export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/android-sdk}"
        export ANDROID_HOME="${ANDROID_HOME:-/opt/android-sdk}"
        (cd client && ./gradlew --no-daemon --console=plain assembleDebug) || exit 1
      else
        echo "[prepare] client/gradlew 不存在——观看端工程尚未落地，跳过构建"
      fi

  # 步骤 5（2026-11-11 补段）：浏览器网关依赖（WS↔TCP 中继 + 静态托管，
  # serve 段的被服务实例；运行时唯一依赖 ws，lockfile 定版幂等安装）
  - run: |
      if [ -f client-web/gateway/package.json ]; then
        (cd client-web/gateway && npm ci --no-audit --no-fund) || exit 1
      else
        echo "[prepare] client-web/gateway/package.json 不存在——网关尚未落地，跳过依赖安装"
      fi

  # 步骤 6（2026-11-11 补段）：浏览器端依赖与构建——vite build 产 dist/，
  # 供 serve 静态托管（新鲜构建口径与 Gradle 各步一致，防陈旧产物陷阱）
  - run: |
      if [ -f client-web/app/package.json ]; then
        (cd client-web/app && npm ci --no-audit --no-fund && npm run build) || exit 1
      else
        echo "[prepare] client-web/app/package.json 不存在——浏览器端尚未落地，跳过构建"
      fi

# serve（2026-11-11 补段）：command 形态启动网关长驻实例——同端口静态托管 +
# /ws 升级（api 场景 http_request 与 web 场景 navigate 的被测 origin，框架全量
# 改写到本实例）。{port} 占位符由框架替换为分配的空闲端口并同值注入
# FENIX_VERIFY_PORT；UPSTREAM 用缺省 127.0.0.1:22333（见上方注释块）。
serve:
  kind: command
  cmd: GATEWAY_PORT={port} STATIC_DIR=client-web/app/dist node client-web/gateway/server.js

# ready（2026-11-11 补段）：探网关入口页；网关对目录请求回落 index.html、
# 对未命中文件 404——随机路径鉴别力自检可通过（200 vs 404）。
ready:
  url: /
  expect: 200
  timeout: 60

# evidence_dir: .fenix/verify-evidence/<spec>/   # 缺省即此值，无需显式声明

# =============================================================================
# regression 段（verify_regression_missing 车道补段，Administrator 2026-11-09）
# ——全量回归声明（design D1/D2）：protocol 模块纯 JVM 单测（5 类 39 例，实测
# 数秒；代码变更即重跑，UP-TO-DATE 时复用上次全绿结果）。gradle 每类产一份
# TEST-*.xml，此处合并为单一 <testsuites> XML 供框架解析（core/regression.py
# 宽松递归遍历 testcase，多 <testsuite> 子元素可解析）。gradle 失败/无 XML 时
# cmd 非零退出且不产出新 XML（runner 先清旧产物 + mtime 新鲜度守卫）→
# fail-closed，不臆造绿结果。
# =============================================================================
regression:
  cmd: |
    set -e
    (cd protocol && chmod +x gradlew && ./gradlew --no-daemon --console=plain test)
    mkdir -p .fenix/regression
    python3 - <<'PYEOF'
    import glob
    import xml.etree.ElementTree as ET
    files = sorted(glob.glob("protocol/build/test-results/test/TEST-*.xml"))
    if not files:
        raise SystemExit("gradle test 未产出 JUnit XML: protocol/build/test-results/test/TEST-*.xml")
    suites = ET.Element("testsuites")
    for f in files:
        node = ET.parse(f).getroot()
        if node.tag == "testsuite":
            suites.append(node)
        else:
            suites.extend(node.findall("testsuite"))
    totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
    for s in suites:
        for k in totals:
            totals[k] += int(s.get(k, 0))
    for k, v in totals.items():
        suites.set(k, str(v))
    ET.ElementTree(suites).write(".fenix/regression/junit.xml", encoding="utf-8", xml_declaration=True)
    print(f"[regression] merged {len(files)} XML -> .fenix/regression/junit.xml: {totals}")
    PYEOF
  output: .fenix/regression/junit.xml
  timeout_seconds: 600
  format: junit
